id:        CBR-BASH-HOOKS_UNQUOTED_VARIABLE_BASH_E
title:     "Hooks Unquoted Variable Bash Eval"
severity:  high
languages: ['bash']
cwe:       ['CWE-78']
source:    semgrep/hooks-unquoted-variable-bash-eval
message: |
  Use of `eval` in a Claude Code or Cursor hook script is dangerous. The `eval` command re-parses its arguments, which can lead to command injection if any variable contains special characters or attacker-controlled data. Avoid `eval` entirely; use arrays, direct command invocation, or other safe alternatives.
pattern: |
  eval $...ARGS
paths:
  include:
    - '**/.claude/**'
    - '**/.cursor/**'
    - '**/.codex/**'
    - '**/.gemini/**'
    - '**/.vscode/**'
    - '**/.cursorrules'
    - '**/.windsurfrules'
    - '**/CLAUDE.md'
    - '**/AGENTS.md'
    - '**/GEMINI.md'
    - '**/copilot-instructions.md'
    - '**/mcp.json'
    - '**/.mcp.json'
    - '**/hooks/**'
