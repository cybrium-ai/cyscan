id:        CBR-GENE-CHECK_REVERSE_TABNABBING
title:     "Check Reverse Tabnabbing"
severity:  low
languages: ['generic']
cwe:       ['CWE-1022']
source:    semgrep/check-reverse-tabnabbing
message: |
  Setting an anchor target of `_blank` without the `noopener` or `noreferrer` attribute allows reverse tabnabbing on Internet Explorer, Opera, and Android Webview.
regex: |
  target\s*=\s*["']_blank["']
pattern_not_regex:
  - 'no(?:opener|referrer)'
