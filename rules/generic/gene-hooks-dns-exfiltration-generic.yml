id:        CBR-GENE-HOOKS_DNS_EXFILTRATION_GENERIC
title:     "Hooks Dns Exfiltration Generic"
severity:  high
languages: ['generic']
cwe:       ['CWE-201']
source:    semgrep/hooks-dns-exfiltration-generic
message: |
  DNS lookup command uses a variable in the hostname, which could exfiltrate sensitive data via DNS queries. In Claude Code and Cursor hooks, this pattern can leak secrets or environment data to attacker-controlled domains. Use static hostnames only in DNS commands.
regex: |
  \b(ping|nslookup|dig|host)\s+.*\$
paths:
  include:
    - '**/.claude/**'
    - '**/.cursor/**'
    - '**/.codex/**'
    - '**/.gemini/**'
    - '**/.vscode/**'
    - '**/.cursorrules'
    - '**/.windsurfrules'
    - '**/CLAUDE.md'
    - '**/AGENTS.md'
    - '**/GEMINI.md'
    - '**/copilot-instructions.md'
    - '**/mcp.json'
    - '**/.mcp.json'
    - '**/hooks/**'
